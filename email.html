<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Analyzer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <h1>SpoofShield</h1>
        <a href="index.html">Overview</a>
        <a href="dns.html">DNS Scanner</a>
        <a href="email.html" class="active">Email Analyzer</a>
        <a href="history.html">History</a>
        <a href="reports.html">Reports</a>
    </div>
    <div class="main">
        <h2>Email Spoofing Investigation</h2>
        <textarea id="headers" placeholder="Paste email headers here..." rows="15" style="width:100%;font-family:monospace;background:var(--elev);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px"></textarea>
        <div style="margin-top:10px;display:flex;gap:10px">
            <button onclick="analyze()">Analyze Headers</button>
            <button onclick="document.getElementById('headers').value=''">Clear</button>
        </div>
        <pre id="result"></pre>
    </div>
    <script>
    async function analyze(){
        const headers = document.getElementById('headers').value;
        const res = await fetch('../api/email_analyze.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({headers})});
        document.getElementById('result').textContent = JSON.stringify(await res.json(),null,2);
    }
    </script>
</body>
</html>
